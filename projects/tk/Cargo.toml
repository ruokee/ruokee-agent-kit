[package]
name = "tk"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Persistent local Task runtime"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
ctrlc = "3.5.2"
regex = "1.12.2"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "net", "process", "rt-multi-thread", "time"] }
toml = "0.9.8"
unicode-normalization = "0.1.24"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zstd = "0.13.3"

[build-dependencies]
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
zstd = "0.13.3"
